name: Publish Python SDK to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require mainline commit and exact version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python - <<'PY'
          import os, re, pathlib, tomllib
          tag = os.environ['RELEASE_TAG']
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), f'Invalid tag: {tag}'
          assert tag == f'v{version}', f'Tag {tag} does not match package version {version}'
          print(f'Publishing super-market {version} from mainline commit')
          PY
      - name: Compile generated sources
        run: python -m compileall -q src/super_market
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Check wheel import (never contact trading API)
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import importlib.metadata
          from super_market import SuperMarketAPI, AsyncSuperMarketAPI
          assert importlib.metadata.version('super-market')
          print('Validated wheel; no credentials, market or order requests')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/super-market
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing (OIDC; no API token)
        uses: pypa/gh-action-pypi-publish@release/v1
