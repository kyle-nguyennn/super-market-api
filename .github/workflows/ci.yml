name: Python SDK package validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile generated Python sources
        run: python -m compileall -q src/super_market
      - name: Build wheel and sdist, check package metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel installation and public imports (no API requests)
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import importlib.metadata
          import pathlib
          import tomllib
          from super_market import SuperMarketAPI, AsyncSuperMarketAPI
          expected = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert importlib.metadata.version('super-market') == expected
          print('SDK import and wheel installation successful; no API requests sent')
          PY
      # Do NOT execute tests/smoke-test.py in CI. It calls every API operation,
      # including live order placement, market creation, and cancellation.
